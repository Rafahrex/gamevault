{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GameVault - Register</title>
    <link rel="stylesheet" href="{% static 'tienda/styles.css' %}" />
    <style>
      .auth-container {
        max-width: 400px;
        margin: 50px auto;
        background: #16202d;
        padding: 30px;
        border-radius: 4px;
      }
      .auth-container input {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        background: #0e141d;
        border: 1px solid #2a475e;
        color: #fff;
        border-radius: 2px;
      }
      .auth-container p {
        margin-bottom: 15px;
        font-size: 13px;
        color: #8f98a0;
      }
      .auth-container label {
        display: block;
        color: #66c0f4;
        margin-bottom: 5px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="auth-container">
        <h1 style="font-size: 20px; border: none; margin-bottom: 15px">
          CREATE ACCOUNT
        </h1>
        <form method="POST">
          {% csrf_token %} {{ form.as_p }}
          <button
            type="submit"
            class="btn-search"
            style="width: 100%; margin-top: 10px"
          >
            Register
          </button>
        </form>
        <p style="margin-top: 20px; text-align: center">
          Already have an account?
          <a href="{% url 'login' %}" style="color: #66c0f4">Log in</a>
        </p>
      </div>
    </div>
  </body>
</html>
